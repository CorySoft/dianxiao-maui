name: Build MAUI Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Install MAUI workload
      run: |
        dotnet workload install maui-android
        dotnet workload install android

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-36 build-tools;36.0.0'

    - name: Restore dependencies
      run: dotnet restore DianxiaoMaui.csproj

    - name: Build Release APK
      run: |
        dotnet build DianxiaoMaui.csproj \
          -c Release \
          -f net10.0-android36.0 \
          -p:AndroidSdkDirectory=$ANDROID_HOME \
          -p:AndroidSigningKeyStore= \
          -p:AndroidSigningKeyAlias= \
          -p:AndroidSigningKeyPass= \
          -p:AndroidSigningStorePass=

    - name: Find APK
      id: find_apk
      run: |
        APK_PATH=$(find . -name "*.apk" -path "*/bin/Release/*" | head -1)
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
        echo "Found APK: $APK_PATH"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: dianxiao-maui-apk
        path: ${{ steps.find_apk.outputs.apk_path }}
        retention-days: 30

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ steps.find_apk.outputs.apk_path }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}