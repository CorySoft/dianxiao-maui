name: Build MAUI Android APK (No Workload)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-35 build-tools;35.0.0'

    - name: Install MAUI workload (required for Android targets)
      run: |
        dotnet workload install maui-android
        dotnet workload install android

    - name: Restore dependencies
      run: dotnet restore DianxiaoMaui.csproj

    - name: Build Release APK
      run: |
        dotnet build DianxiaoMaui.csproj \
          -c Release \
          -f net10.0-android35.0 \
          -p:AndroidSdkDirectory=$ANDROID_HOME \
          -p:AndroidPackageFormat=apk

    - name: Create debug keystore
      run: |
        KEYSTORE=$RUNNER_TEMP/debug.keystore
        if [ ! -f "$KEYSTORE" ]; then
          keytool -genkey -v -keystore "$KEYSTORE" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -storetype pkcs12 2>/dev/null || true
        fi
        echo "KEYSTORE=$KEYSTORE" >> $GITHUB_ENV

    - name: Sign APK
      run: |
        APK_PATH=$(find . -name "*.apk" -path "*/bin/Release/*" | head -1)
        SIGNED="$APK_PATH.signed"
        if command -v jarsigner &>/dev/null; then
          jarsigner -verbose -keystore "$KEYSTORE" -storepass android -keypass android \
            -signedjar "$SIGNED" "$APK_PATH" androiddebugkey 2>&1
          mv "$SIGNED" "$APK_PATH"
          echo "Signed: $APK_PATH"
        else
          echo "jarsigner not found, APK unsigned"
        fi

    - name: Find APK
      id: find_apk
      run: |
        APK_PATH=$(find . -name "*.apk" -path "*/bin/Release/*" | head -1)
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
        echo "Found APK: $APK_PATH"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: dianxiao-maui-apk
        path: ${{ steps.find_apk.outputs.apk_path }}
        retention-days: 30

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ steps.find_apk.outputs.apk_path }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}